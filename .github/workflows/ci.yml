name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # webview_go needs the GTK 3 and WebKitGTK development headers to compile.
      - name: Install GTK 3 and WebKitGTK 4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: make build

      - name: Check formatting and vet
        run: make vet

      # The smoke test needs a display and a dsh install, so CI stops at the
      # unit tests: port selection and URL parsing need neither.
      - name: Unit tests
        run: make unit
